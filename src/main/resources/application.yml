spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are discovered from the issuer's JWKS (cached, rotation-friendly). Discovery is lazy,
          # so the service starts even if the authorization server is not reachable yet.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          audiences: ${JWT_AUDIENCE:activation-service}
  task:
    scheduling:
      pool:
        size: 2
      shutdown:
        # Let an in-flight provider call finish and record its result on shutdown
        await-termination: true
        await-termination-period: 30s

server:
  shutdown: graceful

provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
  # Injected from a secret store in production; never logged
  api-key: ${PROVIDER_API_KEY:}
  connect-timeout: 2s
  read-timeout: 5s

activation:
  processing:
    enabled: true
    poll-interval: 1s
    batch-size: 10
    # Must exceed batch-size x (connect-timeout + read-timeout), or a slow batch would be reclaimed mid-flight
    lease-timeout: 2m
    reconciliation-interval: 30s
  retry:
    max-attempts: 5
    initial-delay: 2s
    multiplier: 2.0
    max-delay: 5m

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    # Duplicate externalId (SQLState 23505) is an expected outcome handled by the service (ADR-0002).
    # Unexpected database errors are still logged, with their cause, by ApiExceptionHandler.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
