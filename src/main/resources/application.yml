spring:
  application:
    name: activation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/activation}
    username: ${DB_USERNAME:activation}
    password: ${DB_PASSWORD:activation}
    hikari:
      # Fail fast when the database is down (the API answers 503) instead of holding the caller for 30 s
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are discovered from the issuer's JWKS (cached, rotation-friendly). Discovery is lazy,
          # so the service starts even if the authorization server is not reachable yet.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090/default}
          audiences: ${JWT_AUDIENCE:activation-service}
  task:
    scheduling:
      pool:
        size: 2
      shutdown:
        # Let an in-flight provider call finish and record its result on shutdown
        await-termination: true
        await-termination-period: 30s

server:
  shutdown: graceful

# Actuator on its own port: reachable by the orchestrator and Prometheus, never exposed publicly (R8.6)
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        activation.provider.calls: true
  # Distributed tracing (OpenTelemetry). Spans are exported only when an OTLP endpoint is configured
  # (MANAGEMENT_OTLP_TRACING_ENDPOINT, set in docker-compose to the local Jaeger).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  observations:
    enable:
      # One span per security filter adds noise without telling anything the HTTP span does not
      spring.security: false

# Interactive API documentation: /swagger-ui.html (disable with SPRINGDOC_SWAGGER_UI_ENABLED=false)
springdoc:
  swagger-ui:
    operations-sorter: method
    oauth:
      client-id: ${OPENAPI_CLIENT_ID:}
      client-secret: ${OPENAPI_CLIENT_SECRET:}
  # Errors are documented per operation; do not repeat every handler's status on every endpoint
  override-with-generic-response: false

openapi:
  oauth2:
    # Token endpoint the browser calls on "Authorize" (mock-oauth2-server and many servers: <issuer>/token)
    token-url: ${OPENAPI_TOKEN_URL:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/token}

provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
  # Injected from a secret store in production; never logged
  api-key: ${PROVIDER_API_KEY:}
  connect-timeout: 2s
  read-timeout: 5s

activation:
  processing:
    enabled: true
    poll-interval: 1s
    batch-size: 10
    # Must exceed batch-size x (connect-timeout + read-timeout), or a slow batch would be reclaimed mid-flight
    lease-timeout: 2m
    reconciliation-interval: 30s
    # Provider answered 401/403: our credential is wrong, not the request. Postpone without using attempts.
    credentials-rejected-delay: 1m
  circuit-breaker:
    # Open after half of the last 10 calls failed (at least 5 calls); try again after 30 s with one call
    failure-rate-threshold: 50
    sliding-window-size: 10
    minimum-number-of-calls: 5
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 1
  rate-limit:
    # Per client system and per instance; the gateway enforces the global limit
    limit-for-period: ${RATE_LIMIT_PER_SECOND:50}
    refresh-period: 1s
  retry:
    max-attempts: 5
    initial-delay: 2s
    multiplier: 2.0
    max-delay: 5m

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    # Duplicate externalId (SQLState 23505) is an expected outcome handled by the service (ADR-0002).
    # Unexpected database errors are still logged, with their cause, by ApiExceptionHandler.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
